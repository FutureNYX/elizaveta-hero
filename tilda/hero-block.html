<!-- ===========================================================
     HERO - the film, with the existing hero text kept as it is

     PASTE ALL OF THIS INTO ONE TILDA BLOCK:
       Библиотека блоков -> Другое -> T123 "HTML-код"
     then hide or delete the current cover block (rec4027248601).

     THE FILM
       media/hero.mp4     1440x1080   25.8 s   29.4 MB   silent

     This is the raw camera file: the video stream is copied
     bit-for-bit from the original and only the audio was removed.
     It streams from GitHub Pages, which answers range requests, so
     playback starts on the first chunk instead of after a download:
       https://futurenyx.github.io/elizaveta-hero

     WHY IT LOOKS BETTER THAN THE ONE ON THE PAGE NOW
     The current file was re-encoded by Tilda on upload to 1.5 Mbps,
     and it was padded from 4:3 out to 16:9, so a share of even that
     small bitrate is being spent on the black bars rather than on
     the picture. This file is 9.1 Mbps with no bars at all.

     THE TEXT is the same as the cover it replaces: same words, same
     FuturaPT, same weights, same 30% black veil over the film. The
     sizes are fluid rather than fixed so the title does not have to
     jump at each Tilda breakpoint.

     THE FIVE THINGS YOU MIGHT WANT TO CHANGE are the first lines of
     the CSS below:
       --h-mobile   height of the section on a phone
       --h-desktop  height of the section on a laptop
       --focus      which part of the picture survives the crop
       --scrim      the black veil over the film
       --ground     colour behind the film while it loads
     =========================================================== -->

<style>
/* let the block escape Tilda's 960px container */
.t-rec .t123__wrapper,.t123 .t-container,.t123 .t-col{max-width:100%!important;padding:0!important;margin:0!important}

/* ============================================================
   Self-contained, namespaced under .ezh so nothing here can
   reach the rest of the page.
   ============================================================ */
.ezh *,.ezh *::before,.ezh *::after{box-sizing:border-box}
.ezh{
  /* ---- height of the section ----
     svh is the SMALL viewport height: the window as it is with the
     phone's address bar showing, so the section does not jump when
     that bar slides away mid-scroll.

     The film is 4:3 and a phone is far taller than it is wide, so a
     full-height section on a phone crops a lot off the sides. Around
     72svh keeps noticeably more of the picture and still reads as a
     full hero. Put it back to 100svh if you would rather fill the
     screen. */
  --h-mobile:72svh;
  --h-desktop:100svh;

  /* ---- which part of the picture survives the crop ----
     Same syntax as CSS object-position. "50% 50%" keeps the middle.
     Try "50% 35%" to favour the top of the frame. */
  --focus:50% 50%;

  /* ---- the black veil over the film ----
     0.3 is what the current cover uses, and it is what keeps the
     white text readable. */
  --scrim:.3;

  /* colour behind the film - seen only before the poster paints */
  --ground:#0a0a0a;

  --sans:"FuturaPT","TildaSans",Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  display:block;
  background:var(--ground);
  font-family:var(--sans);
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

.ezh__stage{
  position:relative;
  width:100%;
  height:var(--h-mobile);
  background:var(--ground);
  overflow:hidden;
}

@media (min-width:768px){
  .ezh__stage{height:var(--h-desktop)}
}

.ezh__stage video,
.ezh__still{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;            /* fill the section, crop the overflow */
  object-position:var(--focus);
}

/* the poster sits under the film and is covered the moment it
   paints, so the section is never empty and never flashes black */
.ezh__still{z-index:0}
.ezh__stage video{z-index:1;opacity:0;transition:opacity .6s ease}
.ezh[data-playing="1"] .ezh__stage video{opacity:1}

.ezh__scrim{
  position:absolute;
  inset:0;
  z-index:2;
  background:#000;
  opacity:var(--scrim);
  pointer-events:none;
}

/* ---- the copy ---- */
.ezh__copy{
  position:absolute;
  inset:0;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 clamp(20px,6vw,40px);
  color:#fff;
  pointer-events:none;         /* never swallows a click meant for the page */
}
.ezh__copy > *{pointer-events:auto}

.ezh__uptitle{
  font-size:clamp(11px,1.15vw,14px);
  font-weight:600;
  letter-spacing:2.5px;
  text-transform:uppercase;
  margin:0 0 clamp(18px,3.2vw,34px);
}

.ezh__title{
  font-size:clamp(34px,7.2vw,72px);
  font-weight:600;
  letter-spacing:.5px;
  line-height:1.17;
  margin:0;
}

.ezh__descr{
  font-size:clamp(16px,2.2vw,24px);
  font-weight:300;
  line-height:1.5;
  max-width:26em;
  margin:clamp(16px,2.6vw,28px) auto 0;
}

/* ---- the arrow ---- */
.ezh__arrow{
  position:absolute;
  left:50%;
  bottom:clamp(22px,4vw,40px);
  z-index:3;
  transform:translateX(-50%);
  width:34px;
  height:20px;
  opacity:.9;
  animation:ezh-nudge 2.4s ease-in-out infinite;
}
.ezh__arrow svg{width:100%;height:100%;display:block;fill:none;stroke:#fff;stroke-width:1.6}

@keyframes ezh-nudge{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%    {transform:translateX(-50%) translateY(6px)}
}

/* ---- play button ----
   Only ever seen if autoplay is refused: iOS Low Power Mode, or a
   visitor who has asked for reduced motion. */
.ezh__play{
  position:absolute;
  inset:0;
  z-index:4;
  display:grid;
  place-items:center;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
.ezh__play[hidden]{display:none}
.ezh__playDot{
  width:clamp(58px,14vw,84px);
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  display:grid;
  place-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.28);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),background-color .22s;
}
.ezh__play:hover .ezh__playDot{transform:scale(1.06);background:#fff}
.ezh__play:active .ezh__playDot{transform:scale(.97)}
.ezh__play:focus-visible{outline:3px solid #fff;outline-offset:4px}
.ezh__playDot svg{width:36%;height:36%;margin-left:12%;fill:#16161A}

@media (prefers-reduced-motion:reduce){
  .ezh__arrow{animation:none}
  .ezh__playDot,.ezh__stage video{transition:none}
}
</style>

<div class="ezh">
  <div class="ezh__stage">

    <img class="ezh__still"
         src="https://futurenyx.github.io/elizaveta-hero/media/hero-poster.webp"
         alt="" aria-hidden="true" decoding="async" fetchpriority="high">

    <video
      preload="none"
      playsinline
      webkit-playsinline
      muted
      loop
      disablepictureinpicture
      data-full="https://futurenyx.github.io/elizaveta-hero/media/hero.mp4"
      data-lite="https://futurenyx.github.io/elizaveta-hero/media/hero-lite.mp4"
      aria-label="Елизавета Манина за работой"></video>

    <div class="ezh__scrim"></div>

    <div class="ezh__copy">
      <div class="ezh__uptitle">создаю искусство</div>
      <h1 class="ezh__title">ELIZAVETA MANINA</h1>
      <div class="ezh__descr">Закажите живопись, которая идеально дополнит Ваше пространство.</div>
    </div>

    <div class="ezh__arrow" aria-hidden="true">
      <svg viewBox="0 0 34 20"><path d="M1 1l16 16L33 1" stroke-linecap="square"/></svg>
    </div>

    <button class="ezh__play" type="button" aria-label="Смотреть" hidden>
      <span class="ezh__playDot">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </span>
    </button>

  </div>
</div>

<script>
(function () {
  'use strict';

  Array.prototype.forEach.call(document.querySelectorAll('.ezh'), function (wrap) {
    var v    = wrap.querySelector('video');
    var play = wrap.querySelector('.ezh__play');
    if (!v || v.src) return;

    /* ---- which file ----
       Everyone gets the raw film. Only a genuinely constrained
       visitor is sent to the small one: someone who has asked their
       phone to save data, or who is on a 2G connection. */
    var conn = navigator.connection || {};
    var lean = conn.saveData === true || /(^|-)2g$/.test(conn.effectiveType || '');

    v.src = v.getAttribute(lean ? 'data-lite' : 'data-full');

    /* ---- autoplay, muted, once it is actually on screen ----
       preload is "none" until then, so a visitor who never scrolls
       this far pays for the 50 KB poster alone. */
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    v.addEventListener('playing', function () {
      wrap.setAttribute('data-playing', '1');
      play.hidden = true;
    });

    function start() {
      if (calm) { play.hidden = false; return; }
      v.preload = 'auto';
      var q = v.play();
      if (q && q.catch) q.catch(function () { play.hidden = false; });
    }

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { start(); }
          else if (!v.paused) { v.pause(); }
        });
      }, { threshold: 0.15 });
      io.observe(wrap);
    } else {
      start();
    }

    play.addEventListener('click', function () {
      play.hidden = true;
      v.preload = 'auto';
      var q = v.play();
      if (q && q.catch) q.catch(function () { play.hidden = false; });
    });
  });
})();
</script>
